name: Build and Update GitOps

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: myapp-dev-deployment
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  GITOPS_REPO: YOUR_ORG/myapp-gitops

jobs:
  build-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout application code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          IMAGE_URI="${REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          docker build \
            --build-arg APP_VERSION="${IMAGE_TAG}" \
            -t "${IMAGE_URI}" .

          docker push "${IMAGE_URI}"

      - name: Verify image exists in ECR
        run: |
          set -euo pipefail

          aws ecr describe-images \
            --repository-name "${ECR_REPOSITORY}" \
            --image-ids "imageTag=${GITHUB_SHA}" \
            --region "${AWS_REGION}"

      - name: Install yq
        run: |
          set -euo pipefail

          VERSION=v4.44.3
          curl -fsSL \
            "https://github.com/mikefarah/yq/releases/download/${VERSION}/yq_linux_amd64" \
            -o yq

          # In production, verify the downloaded binary checksum.
          sudo install -m 0755 yq /usr/local/bin/yq
          yq --version

      - name: Checkout GitOps repository
        env:
          GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
        run: |
          set -euo pipefail

          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "${GITOPS_TOKEN}" | base64 -w 0)" \
            clone "https://github.com/${GITOPS_REPO}.git" gitops

      - name: Update image tag in GitOps
        working-directory: gitops
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          yq -i '.image.tag = strenv(IMAGE_TAG)' \
            apps/myapp/values.yaml

          git add apps/myapp/values.yaml

          if git diff --cached --quiet; then
            echo "No GitOps changes to commit."
            exit 0
          fi

          git commit -m "Deploy myapp image ${IMAGE_TAG}"
          git push origin HEAD:main
